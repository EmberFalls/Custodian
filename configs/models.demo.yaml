# Repository-safe local demo configuration. It loads the reviewed Behaviour
# package distributed with this repository; it contains no secrets or host paths.
models:
  behaviour:
    enabled: true
    trusted: true
    schema_version: behaviour.v1
    artifact_path: model_artifacts/behaviour-colab-v1
    calibrator_path: null
    thresholds_path: null
  dns:
    enabled: false
    trusted: false
    schema_version: dns.v1
    artifact_path: null
    calibrator_path: null
    thresholds_path: null
  tls_quic:
    enabled: false
    trusted: false
    schema_version: tls_quic.v1
    artifact_path: null
    calibrator_path: null
    thresholds_path: null
