# Repository-safe full-demo configuration. It matches the local showcase
# configuration using relative repository paths and contains no secrets.
models:
  behaviour:
    enabled: true
    trusted: true
    schema_version: behaviour.v1
    artifact_path: model_artifacts/behaviour-colab-v1
    calibrator_path: null
    thresholds_path: null
  dns:
    enabled: true
    trusted: true
    schema_version: dns.v1
    artifact_path: model_artifacts/dns-tunnelling-colab-v1
